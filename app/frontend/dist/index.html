<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cheat Sheets</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1115; color: #cbd5e1;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; }
    .spin { width: 28px; height: 28px; border: 3px solid #334155; border-top-color: #38bdf8;
      border-radius: 50%; animation: s 0.8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #38bdf8; }
  </style>
  <!-- Load the hosted cheat-sheets site in this native window. -->
  <script>
    window.location.replace("https://sheets.njmtech.co.za");
  </script>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <div>Loading cheat sheets…</div>
    <noscript><a href="https://sheets.njmtech.co.za">Open sheets.njmtech.co.za</a></noscript>
  </div>
</body>
</html>

name: Release app

# Builds the sheets-desk desktop app for Windows + Linux and publishes a
# GitHub Release with the binaries attached.
#
# Trigger: push a version tag, e.g.
#     git tag app-v0.1.0 && git push origin app-v0.1.0
#   (plain `v0.1.0` tags work too). Or run it manually from the Actions tab
#   via "Run workflow" (creates/updates a prerelease named by the input).

on:
  push:
    tags:
      - 'v*'
      - 'app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-dev'

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WAILS_VERSION: v2.17.1

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Resolve version
        run: echo "VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS (for the installer)
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Build (portable exe + NSIS installer)
        # Missing makensis is only a warning, so the exe is produced regardless.
        run: wails build -platform windows/amd64 -nsis -skipbindings -ldflags "-X main.version=${VERSION}"

      - name: Stage artifacts
        run: |
          shopt -s nullglob
          mkdir -p dist
          cp build/bin/sheets-desk.exe "dist/sheets-desk-windows-amd64.exe"
          for f in build/bin/*-installer.exe build/bin/*-setup.exe; do
            cp "$f" "dist/sheets-desk-windows-amd64-installer.exe"; break
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Resolve version
        run: echo "VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: wails build -skipbindings -tags webkit2_41 -ldflags "-X main.version=${VERSION}"

      - name: Stage artifact
        run: |
          mkdir -p dist
          tar -czf "dist/sheets-desk-linux-amd64.tar.gz" -C build/bin sheets-desk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/*
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -R dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: sheets-desk ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: dist/**
          fail_on_unmatched_files: true
